<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Переезд с семьёй — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E9; --card:#FFFFFF; --ink:#1E2A33; --muted:#5F6B74; --soft:#8A949B;
  --primary:#1F5F8B; --primary-d:#184C70; --accent:#F2A65A; --accent-d:#E8954A;
  --track:#ECE5DA; --line:#F0EBE3; --beige:#EFE8DC; --dash:#C8C0B3;
  --danger:#E5634B; --ok:#3E8E5E; --r:14px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E6E9EB;font:400 14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.phone{width:390px;height:844px;border-radius:52px;background:var(--bg);position:relative;overflow:hidden;flex:none;
  box-shadow:0 0 0 11px #1B2329,0 0 0 12px #3a444b,0 40px 90px rgba(20,30,40,.35);transform-origin:center}
@media (max-width:500px){
  body{background:var(--bg);display:block}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}
}
#stage{position:absolute;inset:0}

/* ---------- screen skeleton ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .34s var(--ease),opacity .34s var(--ease);will-change:transform}
.screen.from-r{transform:translateX(100%)}
.screen.to-l{transform:translateX(-28%);opacity:.6}
.screen.from-l{transform:translateX(-28%);opacity:.6}
.screen.to-r{transform:translateX(100%)}
.screen.fade-in{opacity:0}
.screen.fade-out{opacity:0}
.screen.dark{background:#141B21;color:#fff}
.status{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 34px;font:600 15px Inter;user-select:none}
.status .clock{cursor:default}
.status .isl{width:38px;height:12px;border-radius:6px;background:var(--ink)}
.dark .status .isl{background:#fff}
.top{flex:none;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding:2px 16px 10px;min-height:52px}
.top .ttl{text-align:center;font:600 17px Manrope,Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(30,42,51,.08);transition:transform .15s}
.rb:active{transform:scale(.92)}
.rb svg{width:20px;height:20px}
.rb.plain{background:none;box-shadow:none}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body > *{flex:none}
.foot{flex:none;padding:8px 16px 22px;display:flex;flex-direction:column;gap:8px}
.has-tabs .foot{padding-bottom:8px}

/* ---------- tab bar ---------- */
.tabs{flex:none;margin:0 12px 16px;background:#fff;border-radius:20px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 7px;box-shadow:0 2px 10px rgba(30,42,51,.06)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px Inter;color:var(--ink)}
.tab .ic{width:44px;height:28px;border-radius:10px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:20px;height:20px}
.tab.on .ic{background:var(--accent)}

/* ---------- type ---------- */
.h1{font:800 28px/1.15 Manrope,Inter,sans-serif;letter-spacing:-.3px;margin:4px 0 4px}
.h2{font:700 22px/1.2 Manrope,Inter,sans-serif;letter-spacing:-.2px}
.t{font:600 15px/1.3 Manrope,Inter,sans-serif}
.s{font-size:12.5px;color:var(--muted);line-height:1.4}
.xs{font-size:11.5px;color:var(--muted)}
.sec{font:700 12px Inter;color:var(--ink);margin:8px 2px 0}
.note{font-size:12px;color:var(--muted);padding:0 2px}
.center{text-align:center}
.muted{color:var(--muted)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt4{margin-top:4px}
.spacer{flex:1 1 auto!important}

/* ---------- buttons ---------- */
.btn{height:52px;border-radius:14px;font:600 16px Manrope,Inter,sans-serif;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;transition:transform .12s,background .2s,opacity .2s;text-align:center;padding:0 16px}
.btn:active{transform:scale(.98);background:var(--primary-d)}
.btn.sec{background:#fff;color:var(--ink)}
.btn.sec:active{background:#f6f3ee}
.btn.acc{background:var(--accent);color:var(--ink);height:44px;font-size:15px}
.btn.acc:active{background:var(--accent-d)}
.btn.sm{height:42px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{display:block;margin:0 auto;font:600 13px Inter;text-decoration:underline;text-underline-offset:2px;text-align:center;padding:6px 8px;color:var(--ink)}
.more{font:600 12px Inter;white-space:nowrap;color:var(--ink);flex:none}

/* ---------- cards ---------- */
.card{background:#fff;border-radius:var(--r);padding:13px 16px;display:block;width:100%;text-align:left}
button.card{transition:transform .12s,background .2s}
button.card:active{transform:scale(.985);background:#fbf9f6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.top-a{align-items:flex-start}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:2px}
.list{background:#fff;border-radius:var(--r);overflow:hidden}
.list .li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;font-size:13.5px;border-top:1px solid var(--line);width:100%;text-align:left}
.list .li:first-child{border-top:0}
.list .li b{font-weight:600;text-align:right}
.list .li.total{font-weight:700}
.bar{height:4px;background:var(--track);border-radius:2px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s var(--ease)}
.step .bar,.stage .bar{margin-top:8px}
.stage .cnt{font:600 11.5px Inter;margin-top:8px;min-width:44px;text-align:right}
.agent{border:1.5px dashed var(--dash);border-radius:var(--r);padding:11px 14px;background:rgba(255,255,255,.6);font-size:12.5px;line-height:1.45}
.agent .ah{font:700 11.5px Inter;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.warn .wh{font:700 13px Inter;display:flex;gap:6px;align-items:center;margin-bottom:3px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;background:var(--primary);color:#fff;font:700 10.5px Inter}
.badge.soft{background:var(--beige);color:var(--ink)}
.ph{background:var(--beige);border-radius:12px;display:grid;place-items:center;color:var(--muted);font:600 11.5px Inter;text-align:center;padding:8px}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--beige);flex:none}
.icon-tile{width:76px;height:76px;border-radius:20px;background:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 2px 10px rgba(30,42,51,.06)}
.icon-tile svg{width:34px;height:34px}

/* hero */
.hero{background:var(--primary);color:#fff;border-radius:18px;padding:13px 16px 16px}
.hero .ov{font:700 10.5px Inter;letter-spacing:.4px;text-transform:uppercase;opacity:.8}
.hero .ht{font:700 20px/1.2 Manrope,Inter,sans-serif;margin:3px 0 3px}
.hero .hx{font-size:12px;opacity:.85;line-height:1.4;margin-bottom:12px}
.pill{height:40px;border-radius:20px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font:600 13.5px Inter;flex:1;min-width:0;box-shadow:0 1px 4px rgba(30,42,51,.06)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.homebar{display:flex;gap:8px;align-items:center;padding:2px 16px 6px;flex:none}

/* fields */
.lbl{font:600 12px Inter;margin:6px 2px 4px;display:block}
.in{height:48px;border-radius:12px;background:#fff;border:1.5px solid transparent;padding:0 14px;font-size:15px;width:100%;outline:none;transition:border-color .2s}
.in:focus{border-color:var(--primary)}
.in.err{border-color:var(--danger)}
textarea.in{height:96px;padding:12px 14px;resize:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .lbl{margin-top:0}
.errtxt{color:var(--danger);font:600 12px Inter;padding:0 2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.nowrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.nowrap::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:16px;background:#fff;font:600 12.5px Inter;white-space:nowrap;transition:background .18s,color .18s;flex:none}
.chip.on{background:var(--primary);color:#fff}
.chip.sm{height:28px;padding:0 12px;font-size:11.5px}
.chip.beige{background:var(--beige)}
.chip.beige.on{background:var(--primary)}

/* segmented */
.seg{background:#fff;border-radius:14px;padding:4px;display:flex;gap:4px}
.seg button{flex:1;height:36px;border-radius:10px;font:600 12.5px Inter;transition:background .2s;text-align:center}
.chip{text-align:center}
.add-ph{width:72px;height:64px;border-radius:12px;background:#fff;border:1.5px dashed var(--dash);font:600 11.5px Inter;display:grid;place-items:center;flex:none}
.seg button.on{background:var(--beige)}

/* checkbox rows */
.chk{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--r);padding:13px 16px;width:100%;text-align:left}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--dash);flex:none;display:grid;place-items:center;margin-top:1px;transition:background .18s,border-color .18s}
.box svg{width:13px;height:13px;opacity:0;stroke:#fff}
.chk.on .box{background:var(--primary);border-color:var(--primary)}
.chk.on .box svg{opacity:1}
.chk .t{font-size:14.5px}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dash);flex:none;display:grid;place-items:center}
.radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);transform:scale(0);transition:transform .18s}
.on > .radio::after,.radio.on::after{transform:scale(1)}
.on > .radio{border-color:var(--primary)}

/* switch */
.sw{width:46px;height:28px;border-radius:14px;background:#D9D2C6;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}

/* table */
.tbl{background:#fff;border-radius:var(--r);overflow:hidden;font-size:12.5px}
.tbl .tr{display:grid;grid-template-columns:1.3fr repeat(var(--n,2),1fr);border-top:1px solid var(--line);align-items:center}
.tbl .tr:first-child{border-top:0}
.tbl .tr > *{padding:11px 8px;text-align:center}
.tbl .tr > :first-child{text-align:left;font-weight:600;padding-left:14px}
.tbl .th{font:700 12px Inter}
.tbl .hl{background:#F3F7FA}
.tbl .best{color:var(--primary);font-weight:700}

/* sheet / overlays */
.dim{position:absolute;inset:0;background:rgba(30,42,51,.42);opacity:0;transition:opacity .3s;z-index:40}
.dim.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:8px 16px 26px;z-index:41;transform:translateY(100%);
  transition:transform .36s var(--ease);max-height:88%;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D8D2C8;margin:0 auto 14px;flex:none}
.sheet .sb{overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.sheet .sb::-webkit-scrollbar{display:none}
.sheet .sf{display:flex;flex-direction:column;gap:8px;margin-top:16px;flex:none}
.sheet .btn.sec{background:var(--bg)}
.sheet .card,.sheet .li-b{background:var(--bg)}
.ticks{display:flex;flex-direction:column;gap:9px;margin:6px 0}
.ticks div{display:flex;gap:10px;font:600 13px/1.35 Inter}
.ticks svg{width:16px;height:16px;flex:none;stroke:var(--primary);margin-top:1px}
.toast{position:absolute;left:50%;top:8px;transform:translate(-50%,-12px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font:600 13px Inter;
  opacity:0;transition:opacity .25s,transform .3s var(--ease);z-index:60;max-width:320px;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.push{position:absolute;left:10px;right:10px;top:10px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;
  box-shadow:0 10px 30px rgba(20,30,40,.18);z-index:55;transform:translateY(-130%);transition:transform .45s var(--ease);cursor:pointer;color:var(--ink)}
.push.show{transform:none}
.push .ai{width:38px;height:38px;border-radius:10px;background:var(--accent);flex:none}
.push .pt{font:700 13px Inter;display:flex;justify-content:space-between;gap:8px}
.push .pt span{font-weight:500;color:var(--muted);font-size:12px}
.push .px{font-size:13px;line-height:1.35}

/* lock screen */
.lock .big{font:700 76px/1 Manrope,Inter,sans-serif;text-align:center;margin-top:56px;letter-spacing:-1px}
.lock .date{text-align:center;font:500 16px Inter;margin-top:8px;color:var(--muted)}
.notif{margin:34px 12px 0;background:#fff;border-radius:22px;padding:13px 14px;display:flex;gap:11px;text-align:left;width:calc(100% - 24px);box-shadow:0 4px 18px rgba(30,42,51,.08);animation:pop .5s .2s both var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.4;animation:pop .35s both var(--ease)}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.msg.typing{display:flex;gap:4px;padding:14px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.actrow{background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font:600 13px Inter;width:100%}
.compose{flex:none;display:flex;gap:8px;align-items:center;margin:0 16px 22px;background:#fff;border-radius:24px;padding:5px 5px 5px 16px}
.compose input{flex:1;border:0;outline:none;height:38px;background:none;font-size:14px}
.compose button{width:38px;height:38px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.compose svg{width:18px;height:18px}

/* calendar */
.cal{background:#fff;border-radius:var(--r);padding:12px 12px 10px}
.cal .mh{font:700 14px Manrope,Inter;margin:0 4px 8px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g span{font:600 10.5px Inter;color:var(--muted);padding:4px 0}
.cal .g button{height:34px;border-radius:10px;font:500 12.5px Inter}
.cal .g button.sel{background:var(--primary);color:#fff;font-weight:700}
.cal .g button.mark{background:var(--beige)}

/* video call */
.vid{background:#1F2A33;border-radius:18px;position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;overflow:hidden}
.vid .cap{position:absolute;inset:0;display:grid;place-items:center;color:#9AA7B0;font-size:12.5px}
.vid .me{position:absolute;right:10px;top:10px;width:78px;height:104px;border-radius:12px;background:var(--primary);display:grid;place-items:center;font:600 12px Inter;color:#fff}
.ask{background:#fff;color:var(--ink);border-radius:14px;padding:11px 13px;position:relative}
.ask .ah{font:700 12.5px Inter;color:var(--primary)}
.ask button{display:flex;gap:7px;font:600 12.5px Inter;padding:3px 0;width:100%;text-align:left}
.ask button.done{color:var(--soft);font-weight:500}
.callbar{background:#1F2A33;border-radius:20px;padding:12px 14px;color:#fff;margin-top:8px}
.cbtn{width:40px;height:40px;border-radius:50%;background:#33414C;display:grid;place-items:center}
.cbtn svg{width:18px;height:18px;stroke:#fff}
.cbtn.off{background:#fff}.cbtn.off svg{stroke:var(--ink)}
.endc{height:44px;width:120px;border-radius:22px;background:var(--danger);display:grid;place-items:center}
.pausec{height:44px;width:120px;border-radius:22px;background:#33414C;display:grid;place-items:center}

/* misc */
.stars{display:flex;gap:6px}
.stars button svg{width:32px;height:32px;fill:#D9D2C6;transition:fill .15s,transform .15s}
.stars button.on svg{fill:var(--ink)}
.stars button:active svg{transform:scale(.88)}
.moods{display:flex;gap:6px}
.moods button{flex:1;height:44px;border-radius:12px;background:#fff;font-size:20px;transition:background .2s}
.moods button.on{background:var(--primary)}
.chart{display:flex;align-items:flex-end;gap:5px;height:72px;margin-top:10px}
.chart i{flex:1;border-radius:4px;background:var(--primary);transition:height .4s var(--ease)}
.chart i.lo{background:var(--accent)}
.photos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.photos span,.photos button{width:42px;height:34px;border-radius:9px;background:var(--beige);font:600 10.5px Inter;display:grid;place-items:center}
.photos button{background:#fff;border:1.5px dashed var(--dash);font-size:16px}
.timeline{position:relative;padding:4px 0 2px 34px}
.timeline .pt{position:relative;padding-bottom:18px}
.timeline .pt:last-child{padding-bottom:0}
.timeline .pt::before{content:"";position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--track);box-shadow:0 0 0 3px #fff;z-index:1}
.timeline .pt.done::before{background:var(--primary)}
.timeline .pt.now::before{background:var(--accent);width:22px;height:22px;left:-30px;top:-1px}
.timeline::before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:3px;background:var(--track);border-radius:2px}
.timeline .prog{position:absolute;left:14px;top:10px;width:3px;height:42%;background:var(--primary);border-radius:2px}
.map{border-radius:var(--r);overflow:hidden;background:#EAF0EA;position:relative}
.map svg{display:block;width:100%;height:100%}
.map .cap{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.9);border-radius:8px;padding:4px 8px;font:600 11px Inter}
.doc{background:#fff;border-radius:var(--r);padding:16px}
.doc .dh{font:800 12.5px Manrope,Inter;text-align:center;letter-spacing:.3px}
.doc .dr{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:11.5px;padding:5px 0;border-top:1px solid var(--line)}
.doc .dr b{font-weight:700}
.jl{display:flex;flex-direction:column;gap:2px}
.jl button{display:flex;gap:10px;padding:8px 10px;border-radius:10px;font-size:13px;text-align:left;width:100%}
.jl button:hover{background:var(--bg)}
.jl button b{width:40px;flex:none;font-weight:700;color:var(--primary)}
.jl .jh{font:700 12px Inter;color:var(--muted);margin:10px 10px 4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="phone" id="phone"><div id="stage"></div></div>
<input type="file" id="file" hidden accept="image/*,.pdf">
<script>
/* =========================================================
   Иконки
   ========================================================= */
const sv=(d,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const I={

const S2N={add:['Добавить варианты','Подготовка готова: {d}, бюджет до {b} ₽','W16'],compare:['Сравнить и выбрать','Вариантов в списке: {n}. Агент сравнит их по вашей анкете','W18'],view:['Просмотр','Запишитесь на просмотр — лично или по видеозвонку','W24'],check:['Проверить договор','Квартира выбрана. Проверьте собственника и договор','W27']};
const S3N={docs:['Документы','Квартира выбрана, договор проверен. Дальше — подготовка к дороге','W30'],tickets:['Билеты','Документы собраны. Добавьте билеты — агент подстроит перевозку и трансфер','W76'],cargo:['Перевозка вещей','Выберите дату и перевозчика','W78'],transfer:['Трансфер','Вещи в пути. Закажите трансфер до вокзала и от вокзала','W34'],accept:['Приёмка и акт','Сфотографируйте квартиру до заселения — соберём акт','W35']};
const nextKey=(o,keys)=>keys.find(k=>!done(o[k]));
function heroFor(id){
  if(id==='W10') return {ov:'Начните здесь',t:'Этап 1 · Подготовка',x:'Город, район и бюджет — около 15 минут',cta:'Начать',go:'W11'};
  if(id==='W65') return {ov:'Переезд завершён',t:'Вы заселились в Москве',x:'Все этапы пройдены, акт — во вкладке «Документы». Помочь освоиться на новом месте?',cta:'Помочь освоиться',go:'W36'};
  let set,keys,n,stage;
  if(id==='W86'){set=st.s1;keys=S1;n=S1N;stage=1}
  else if(id==='W63'){set=st.s2;keys=S2;n=S2N;stage=2}
  else {set=st.s3;keys=S3;n=S3N;stage=3}
  const k=nextKey(set,keys)||keys[0];
  let [t,x,go]=n[k];
  x=x.replace('{d}',st.district).replace('{b}',money(st.budget)).replace('{n}',st.variants.length||3);
  if(k==='docs'&&st.dealLeft>0){x='Квартира выбрана, но в договоре не проверено: '+plur(st.dealLeft,'пункт','пункта','пунктов')+'. Дальше — подготовка к дороге'}
  if(k==='cargo'&&st.s3.cargo===.5){x='Дата выбрана: загрузка 12 авг, доставка 15 авг. Осталось выбрать перевозчика';go='W31'}
  if(k==='district'&&st.s1.district===.5){go='W13'}
  if(k==='add'&&st.variants.length){go='W18'}
  return {ov:'Вы остановились здесь',t:`Этап ${stage} · ${t}`,x,cta:'Продолжить',go};
}
function soonFor(id){
  return ({
    W10:['Скоро','14 августа — переезд, до него 3 месяца',''],
    W86:['Скоро','1 июня — выбрать район, чтобы успеть с жильём','data-go="W13"'],
    W63:['Новое','3 свежих объявления в районе '+st.district,'data-act="autopick"'],
    W64:['Скоро','1 августа — заселение по договору','data-act="doc" data-a="contract"'],
    W82:['Скоро','14 августа — поезд 020С, отправление 21:40','data-go="W76"'],
    W65:['Скоро','Через месяц спросим, как вы освоились',''],
  })[id];
}
function home(id){
  const h=heroFor(id), [so,sx,sa]=soonFor(id);
  const stage=(n,t,s,go,set,keys)=>{const c=count(set,keys),all=c===keys.length;return `<button class="card stage" data-go="${go}"><div class="row"><span class="t">${n}. ${t}</span>${more('Открыть')}</div><div class="s">${s}</div><div class="row">${BAR(pct(set,keys))}<span class="cnt">${all?'Готово':c+' из '+keys.length}</span></div></button>`};
  const agentNote=id==='W10'?AG('Этапы можно проходить в любом порядке — откройте любой выше'):id==='W65'?AG('Адаптация — по желанию: гид по району, занятия для детей, бытовые услуги'):'';
  return page({tab:'plan',
    top:`<div class="homebar"><button class="pill" data-act="sheet" data-a="W80"><span>${st.move.from} → ${st.move.to} · ${st.move.when.split(' ')[0].toLowerCase()}</span> <small>▾</small></button><button class="rb" data-go="W47" aria-label="Агент">${I.spark}</button></div>`,
    body:`<div class="h1">План переезда</div>
      <div class="hero"><div class="ov">${h.ov}</div><div class="ht">${h.t}</div><div class="hx">${h.x}</div>${B(h.cta,`data-go="${h.go}"`,'acc')}</div>
      <${sa?'button':'div'} class="card row" ${sa}><div class="stack grow"><span class="xs" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px">${so}</span><span style="font:600 12.5px Inter">${sx}</span></div>${sa?'<span style="font-size:18px">›</span>':''}</${sa?'button':'div'}>
      <div class="sec">Все этапы — можно открыть любой</div>
      ${stage(1,'Подготовка','Город, район, бюджет','W72',st.s1,S1)}
      ${stage(2,'Подбор жилья','Варианты, просмотры, договор','W73',st.s2,S2)}
      ${stage(3,'Переезд и адаптация','Документы, дорога, приёмка','W74',st.s3,S3)}
      ${agentNote}`});
}

const otp=(err)=>page({
  top:H('',{agent:false}),
  body:`<div class="h2">Введите код</div>
    <div class="card s" style="color:var(--ink)">Отправили СМС на +7 900 ••• •• 12</div>
    <div class="row" style="justify-content:flex-start;gap:8px" id="otp">${[0,1,2,3].map(i=>`<input class="in ${err?'err':''}" style="width:58px;height:58px;text-align:center;font:700 22px Manrope;padding:0" maxlength="1" inputmode="numeric" value="${err?('4822'[i]):''}" data-i="${i}">`).join('')}</div>

  foot:(err?L('Отправить код ещё раз','data-act="resend"'):'')+B('Подтвердить','data-act="otp"')});
const otpMount=(el,err)=>{
  const ins=[...el.querySelectorAll('#otp input')];
  ins.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);ins.forEach(x=>x.classList.remove('err'));if(inp.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))ACT.otp()});
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()});
  });
  if(!err){
    setTimeout(()=>ins[0]&&ins[0].focus({preventScroll:true}),350);
    let s=59;const t=setInterval(()=>{const r=el.querySelector('#resend');if(!r||!el.isConnected)return clearInterval(t);s--;if(s<=0){clearInterval(t);r.outerHTML=L('Отправить код ещё раз','data-act="resend"')}else r.textContent='Отправить снова через 0:'+String(s).padStart(2,'0')},1000);
    setTimeout(()=>push('СМС · сейчас','Ваш код для входа: '+st.smsCode,()=>{ins.forEach((x,i)=>x.value=st.smsCode[i]);setTimeout(()=>ACT.otp(),250)}),900);
  }
};

  body:`<div class="note" style="color:var(--ink)">${st.district} · оценка до выбора квартиры</div>
    ${AG('Это средние цены по объявлениям в районе за октябрь. Точную сумму посчитаю, когда добавите конкретную квартиру')}
    <div class="sec">Сколько комнат нужно</div>
    <div class="chips" data-single>${['1','2','3','4+'].map((r,i)=>`<button class="chip ${st.rooms===i+1?'on':''}" style="width:42px;padding:0" data-act="rooms" data-a="${i+1}">${r}</button>`).join('')}</div>
    <div class="sec">Каждый месяц</div>
    ${KV([['Аренда (средняя в районе)','≈ '+money(b.rent)+' ₽'],['ЖКУ (в среднем)','≈ '+money(b.z)+' ₽'],['Итого в месяц','≈ '+money(b.month)+' ₽','total'],['Ваш бюджет','до '+money(st.budget)+' ₽']])}
    ${b.month>st.budget?`<div class="card warn"><div class="wh">${I.warn}Выше бюджета на ${money(b.month-st.budget)} ₽/мес</div><div class="s">Агент подскажет, как уложиться: район дешевле или меньше комнат</div></div>`:`<div class="card" style="font:600 13px Inter;color:var(--ok)">✓ Укладывается в бюджет — запас ${money(st.budget-b.month)} ₽/мес</div>`}
    <div class="sec">Разово при заселении</div>
    ${KV([['Залог (обычно = 1 мес.)','≈ '+money(b.dep)+' ₽'],['Комиссия (обычно 50%)','≈ '+money(b.com)+' ₽'],['Перевозка Ростов → Москва','≈ '+money(b.move)+' ₽'],['Итого разово','≈ '+money(b.once)+' ₽','total']])}`,
  foot:(b.month>st.budget?B('Посмотреть, как уложиться','data-go="W15"')+B('Оставить и продолжить','data-act="keepBudget"','sec'):B('Готово — к шагам этапа','data-act="budgetDone"')+B('Не укладываюсь в бюджет','data-go="W15"','sec'))+L('Сразу перейти к подбору жилья','data-act="toFlats"')})});

def('W15',1,'Бюджет превышен',()=>{const b=calcBudget();const over=b.month-st.budget;const i=st.rooms-1;const mit=RENT['Митино'][i]+ZKU[i];const one=RENT['Хорошёво-Мнёвники'][0]+ZKU[0];const isMit=st.district==='Митино';return page({
  top:H('Полная стоимость'),
  body:`<div class="card warn"><div class="wh">${I.warn}${over>0?'Выше бюджета на '+money(over)+' ₽/мес':'Почти на пределе бюджета'}</div><div class="s">Ваш бюджет — до ${money(st.budget)} ₽, а в этом районе выйдет ~${money(b.month)} ₽</div></div>
    ${isMit?AG('Уложиться можно, если взять квартиру на комнату меньше или поднять бюджет'):AG(`Митино дешевле на ~${money(b.month-mit)} ₽/мес, школа так же в 7 минутах. Посмотрим?`)}
    ${isMit?'':`<button class="card" data-act="dist" data-a="Митино"><div class="row"><span class="t">Митино, ${st.rooms}-комн.</span>${more()}</div><div class="s mt4">~${money(mit)} ₽/мес с ЖКУ · совпадение 88%</div></button>`}
    <button class="card" data-act="roomsTo1"><div class="row"><span class="t">1-комн. в Хорошёво</span>${more()}</div><div class="s mt4">~${money(one)} ₽/мес с ЖКУ · совпадение 80%</div></button>`,
  foot:B('Показать районы дешевле','data-go="W13"')+B('Изменить бюджет','data-act="edit" data-a="budget"','sec')+L('Оставить как есть','data-act="keepBudget"')})});

/* ---------- Карта 2: Подбор жилья ---------- */
def('W73',2,'Этап 2 · Подбор жилья',()=>{const s=st.s2,c=count(s,S2),nk=nextKey(s,S2);const lbl={add:'добавить варианты',compare:'сравнение',view:'просмотр',check:'проверка договора'};const has=st.variants.length>0;const go={add:has?'W18':'W16',compare:has?'W18':'W16',view:has?'W24':'W16',check:'W27'};return page({
  top:H('Подбор жилья'),
  body:`<div class="card"><div class="xs">Этап 2 из 3</div><div style="font:700 12px Inter;margin:2px 0 8px">${c===4?'Этап готов':'Сделано '+c+' из 4'}</div>${BAR(pct(s,S2))}</div>
    ${stepRow('Добавить варианты',st.variants.length?st.variants.length+' варианта в списке':'С любых сайтов или вручную',st.variants.length?'Изменить':'Начать',s.add,`data-go="${go.add}"`)}
    ${stepRow('Сравнить и выбрать','Сводка агента по вариантам',done(s.compare)?'Изменить':'Продолжить',s.compare||(s.add?.5:0),`data-go="${go.compare}"`)}
    ${stepRow('Записаться на просмотр','Лично или по видеозвонку',done(s.view)?'Изменить':'Начать',s.view,`data-go="${go.view}"`)}
    ${stepRow('Проверить договор','Мошенничество, залог, опись',done(s.check)?'Изменить':'Начать',s.check,'data-go="W27"')}
    <div class="note">Шаги можно проходить в любом порядке. После шага вы возвращаетесь сюда</div>`,
  foot:nk?(L(`Пропустить шаг «${S2N[nk][0]}»`,`data-act="skip" data-a="s2.${nk}"`)+B('Продолжить: '+lbl[nk],`data-go="${go[nk]}"`)+L('На главную','data-act="home"')):B('На главную','data-act="home"')})});

def('W16',2,'Жильё · добавить ссылку',()=>page({tab:'flat',
  top:H('Жильё',{back:false,agent:false}),
  body:`<div class="card s" style="color:var(--ink);padding:10px 14px">${st.variants.length?'В списке '+plur(st.variants.length,'вариант','варианта','вариантов')+'. Добавьте ещё':'Пока нет вариантов. Выберите, как их добавить'}</div>
    <div class="card"><div class="row"><span class="t">✦ Автоподбор</span><span class="badge">Семья+</span></div>
      <div class="s mt4">Агент сам ищет квартиры на площадках-партнёрах по вашей анкете и добавляет подходящие в список</div>
      <div class="mt8">${B('Включить автоподбор','data-act="autopick"','sm')}</div>
      <div class="xs center mt8">Мониторинг 24/7: пуш о новых вариантах и снижении цены</div></div>
    <div class="xs center" style="font-weight:600;margin:4px 0">или добавьте сами</div>
    <div class="card"><label class="lbl" style="margin-top:0">Ссылка на объявление</label>
      <input class="in" id="flatlink" placeholder="https://…" style="background:var(--bg)" inputmode="url" oninput="this.classList.remove('err');document.getElementById('linkerr').hidden=true"><div class="errtxt mt4" id="linkerr" hidden>Вставьте ссылку на объявление — например, с Циана или Авито</div>
      <div class="mt8">${B('Добавить по ссылке','data-act="addLink"','sm')}</div>
      ${L('Заполнить вручную','data-go="W58" style="margin-top:6px"')}</div>`}));

  body:`${F('Ссылка на объявление',st.badLink||'https://example-site.ru/flat/123','','readonly')}
    <div class="card warn"><div class="wh">${I.warn}Не удалось загрузить объявление</div><div class="s">Площадка не поддерживается или ссылка неверная. Проверьте ссылку или заполните данные вручную — это 1 минута</div></div>`,

def('W58',2,'Добавить вручную',()=>page({
  top:H('Новый вариант'),
  body:`${F('Адрес','','Например: ул. Генерала Глаголева, 10','id="maddr"')}
    ${F('Цена в месяц, ₽','','Например: 85 000','id="mprice" inputmode="numeric"')}

    <div class="grid2 mt4"><div>${F('Площадь, м²','','54','id="marea" inputmode="numeric"')}</div><div>${F('Этаж','','3 из 9','')}</div></div>
    <div class="errtxt" id="merr" hidden>Укажите адрес и цену — без них агент не сравнит вариант</div>
    ${F('Контакт или ссылка (необязательно)','','+7 900 …')}

  foot:B('Сохранить вариант','data-act="saveManual"')}));

def('W18',2,'Список сравнения',()=>{const v=[...st.variants];const sk={m:(a,b)=>b.m-a.m,price:(a,b)=>a.price-b.price,school:(a,b)=>a.school-b.school}[st.sort];v.sort(sk);
  const pick=Array.isArray(st.pick);const n=pick?st.pick.length:0;
  const card=x=>{const i=st.variants.indexOf(x);const on=pick&&st.pick.includes(i);
    return `<div class="card row top-a" role="button" tabindex="0" data-act="${pick?'pickVar':'openVar'}" data-a="${i}" style="justify-content:flex-start;gap:12px;cursor:pointer;${on?'box-shadow:inset 0 0 0 2px var(--primary)':''}">
      ${pick?`<span class="box" style="margin-top:16px;${on?'background:var(--primary);border-color:var(--primary)':''}">${I.check.replace('<svg','<svg style="opacity:'+(on?1:0)+'"')}</span>`:''}<span class="thumb"></span>
      <div class="stack grow"><span class="t">${x.t} · ${x.d}</span><span class="xs mt4">${money(x.price)} ₽ · школа ${x.school} м · ${x.m}%</span></div>
      ${pick?'':`<button class="rb" style="width:34px;height:34px;box-shadow:none;background:var(--bg);font:700 16px Inter;flex:none" data-act="varMenu" data-a="${i}" aria-label="Действия с вариантом">⋯</button>`}</div>`};
  const many=st.variants.length>3&&!st.plus;
  return page({tab:'flat',
  top:H('Мои варианты · '+v.length,{back:false,right:pick?'<span></span>':`<button class="rb" data-go="W16" aria-label="Добавить">${I.plus}</button>`}),
  body:`${pick?`<div class="card" style="padding:11px 14px"><span class="t" style="font-size:14px">Бесплатное сравнение</span><div class="xs mt4">Отметьте до 3 вариантов — агент сравнит их. Остальные останутся в списке</div></div>`:''}
      ${`<div class="chips" data-single>${[['m','По совпадению'],['price','Цена'],['school','Школа ближе']].map(([k,l])=>`<button class="chip ${st.sort===k?'on':''}" data-act="sort" data-a="${k}">${l}</button>`).join('')}</div>`}
    ${v.map(card).join('')||'<div class="note center mt16">В списке пока пусто</div>'}
    ${pick?'':`<div class="note">${st.plus?'С Семья+ сравнение без лимита':'Бесплатно агент сравнивает до 3 вариантов за раз'}</div>`}`,
  foot:pick?B(`Сравнить выбранные · ${n} из 3`,n>=2?'data-act="compareFree"':'disabled')+L('Отмена','data-act="pickCancel"')
    :many?B('Выбрать 3 и сравнить бесплатно','data-act="pickStart"')+B('Сравнить все с Семья+','data-act="compare"','sec')+L('+ Добавить вариант','data-go="W16"')
    :B('Сравнить с агентом','data-act="compare"')+B('+ Добавить вариант','data-go="W16"','sec')})});

def('W57',2,'Автоподбор',()=>page({tab:'flat',
  top:H('Автоподбор'),
  body:`<div class="card row top-a"><div class="stack"><span class="t">✦ Агент ищет квартиры</span><span class="xs mt4">Мониторинг 24/7 · пуш о новых вариантах и снижении цены</span></div><button class="sw on" data-sw aria-label="Автоподбор"></button></div>
    <div class="card t" style="padding:10px 16px">Найдено 3 новых варианта</div>
    ${AUTO.map((x,i)=>{const added=st.variants.some(v=>v.addr===x.addr);return `<div class="card row top-a" style="justify-content:flex-start;gap:12px"><span class="thumb"></span><div class="stack grow"><span class="t">${x.t} · ${x.d}</span><span class="xs mt4">${money(x.price)} ₽ · школа ${x.school} м · ${x.m}%</span></div><button class="more" data-act="addAuto" data-a="${i}">${added?'Добавлено ✓':'Добавить ›'}</button></div>`}).join('')}
    <div class="spacer"></div>${L('Изменить критерии поиска','data-go="W55"')}`,
  foot:B('Добавить все в сравнение','data-act="addAllAuto"')}));

const vlabel=x=>x.d+', '+(x.t.split(', ')[1]||x.t);
def('W23',2,'Сводка агента',()=>{const v=[...cmpList()].sort((a,b)=>b.m-a.m);if(v.length<2)return page({top:H('Сводка агента'),body:`<div class="spacer"></div>${AG('Чтобы сравнить, добавьте хотя бы 2 варианта — по ссылке с любого сайта или вручную')}<div class="spacer"></div>`,foot:B('Добавить вариант','data-go="W16"')});const n=v.length;const best=st.variants.indexOf(v[0]);return page({
  top:H('Сводка агента'),
  body:`${AG(`Лучше всего вам подходит ${vlabel(v[0])}: школа в ${v[0].school} м, ${v[0].park==='—'?'':'парк рядом, '}${money(v[0].price)} ₽ в месяц`)}
    <div style="overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none"><div class="tbl" style="--n:${n};min-width:${n>3?110+n*86:0}px">
      <div class="tr th"><span></span>${v.map((x,i)=>`<span class="${i===0?'hl best':''}" style="font-size:11px;line-height:1.25">${i===0?'★ ':''}${vlabel(x)}</span>`).join('')}</div>
      ${[['Цена/мес',x=>Math.round(x.price/1000)+' тыс'],['До школы',x=>x.school+' м'],['Парк',x=>x.park],['До работы',x=>x.work+' мин'],['Совпадение',x=>x.m+'%']].map(([l,f])=>`<div class="tr"><span>${l}</span>${v.map((x,i)=>`<span class="${i===0?'hl best':''}">${f(x)}</span>`).join('')}</div>`).join('')}
      <div class="tr"><span></span>${v.map((x,i)=>`<span class="${i===0?'hl':''}"><button class="chip sm ${i===0?'on':''}" data-act="openVar" data-a="${st.variants.indexOf(x)}">Подробнее</button></span>`).join('')}</div>
    </div></div>
    <div class="note">Сводка обновится после просмотров и вашей оценки квартир</div>`,
  foot:B('Подробнее: '+vlabel(v[0]),`data-act="openVar" data-a="${best}"`)})},()=>{st.s2.compare=1});

    <div class="card"><div class="row"><span class="t">${v.sn}</span><b style="font:700 12px Inter">${v.school} м</b></div><div class="s">${v.sr}</div></div>
    <div class="card"><div class="row"><span class="t">${v.kg}</span><b style="font:700 12px Inter">${v.kgd} м</b></div><div class="s">${v.kgs}</div></div>
    <div class="card"><div class="row"><span class="t">Полная стоимость</span><b style="font:700 12px Inter">${money(v.full)} ₽</b></div><div class="s">Залог, комиссия, ЖКУ</div></div>`,

def('W61',2,'Площадка аренды (внешний модуль)',()=>{const v=curVar();return page({

  body:`<div class="card xs" style="color:var(--ink);font-weight:600;padding:10px 14px">Сайт площадки аренды — внешний модуль</div>

  top:H('Видеопросмотр'),

function build(id){
  const d=SCR[id];const w=document.createElement('div');w.innerHTML=d.render().trim();const el=w.firstElementChild;el.dataset.id=id;return el;
}
function show(id,mode){
  stage.querySelectorAll('.push').forEach(p=>p.remove());
  if(id!=='W18')st.pick=null;
  const el=build(id);
  const old=curEl;
  if(mode==='fwd'){el.classList.add('from-r')}
  else if(mode==='back'){el.classList.add('from-l')}
  else if(mode==='fade'){el.classList.add('fade-in')}
  if(mode==='back'&&old){stage.appendChild(el);old.style.zIndex=2;}else stage.appendChild(el);
  curEl=el;
  if(SCR[id].mount) SCR[id].mount(el);
  if(mode&&old){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.classList.remove('from-r','from-l','fade-in');
      if(mode==='fwd')old.classList.add('to-l');else if(mode==='back')old.classList.add('to-r');else old.classList.add('fade-out');
      setTimeout(()=>old.remove(),360);
    }));
  } else if(old) old.remove();
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
function go(id,opt={}){
  if(SHEETS[id]) return openSheet(id);
  if(!SCR[id]) return toast('Экран '+id+' не найден');
  closeSheet(true);
  if(HOME_IDS.includes(id)) id=currentHome();
  if(opt.reset){stack=[id];return show(id,'fade')}
  if(opt.replace&&stack.length){stack[stack.length-1]=id;return show(id,'fade')}
  if(stack[stack.length-1]===id) return refresh();
  stack.push(id);show(id,opt.anim||'fwd');
}
function back(){
  if(sheetEl) return closeSheet();
  if(stack.length<2){const h=currentHome();if(stack[0]!==h){stack=[h];show(h,'back')}return}
  stack.pop();let id=stack[stack.length-1];if(HOME_IDS.includes(id)){id=currentHome();stack[stack.length-1]=id}
  show(id,'back');
}
function refresh(){if(!curEl)return;const id=curEl.dataset.id;const sc=curEl.querySelector('.body')?.scrollTop||0;const el=build(id);stage.replaceChild(el,curEl);curEl=el;if(SCR[id].mount)SCR[id].mount(el);const b=el.querySelector('.body');if(b)b.scrollTop=sc}
function goHome(){const h=currentHome();stack=[h];show(h,'back')}
function goHomeFade(){const h=currentHome();stack=[h];show(h,'fade')}

/* sheets */
function openSheet(id,custom){
  closeSheet(true);
  const s=custom||SHEETS[id];
  dimEl=document.createElement('div');dimEl.className='dim';dimEl.dataset.act='closeSheet';
  sheetEl=document.createElement('div');sheetEl.className='sheet';sheetEl.setAttribute('role','dialog');
  sheetEl.innerHTML=`<div class="grab"></div><div class="sb">${typeof s.html==='function'?s.html():s.html}</div>${s.foot?`<div class="sf">${typeof s.foot==='function'?s.foot():s.foot}</div>`:''}`;
  stage.append(dimEl,sheetEl);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{dimEl.classList.add('show');sheetEl.classList.add('show')}));
  if(s.mount) s.mount(sheetEl);
}
function closeSheet(instant){
  if(!sheetEl)return;const s=sheetEl,d=dimEl;sheetEl=dimEl=null;
  if(instant){s.remove();d.remove();return}
  s.classList.remove('show');d.classList.remove('show');setTimeout(()=>{s.remove();d.remove()},360);
}
function info(key){const [t,txt,btn]=INFO[key];openSheet(null,{html:`<div class="h2" style="font-size:20px">${t}</div><div class="s" style="color:var(--ink);font-size:14px;white-space:pre-line">${txt}</div>`,foot:B('Понятно','data-act="closeSheet"')+(btn?B(btn[0],`data-go="${btn[1]}"`,'sec'):'')})}

/* toast & push */
let toastT;
function toast(msg){let t=stage.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';stage.appendChild(t)}t.textContent=msg;requestAnimationFrame(()=>t.classList.add('show'));clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}
function push(title,text,onTap){
  const p=document.createElement('div');p.className='push';p.innerHTML=`<span class="ai"></span><div class="grow"><div class="pt">Переезд с семьёй<span>${title}</span></div><div class="px">${text}</div></div>`;
  stage.appendChild(p);requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('show')));
  const hide=()=>{p.classList.remove('show');setTimeout(()=>p.remove(),450)};
  p.onclick=()=>{hide();onTap&&onTap()};setTimeout(hide,6000);
}

  join:a=>{st.joined[a]=!st.joined[a];refresh();if(st.joined[a])toast('Готово!')},
  feedback:a=>{toast(a?'Спасибо! Отзыв отправлен':'Можно оценить позже в профиле');goHomeFade()},
  /* прочее */
  docSeg:a=>{st.docSeg=a;refresh()},
  doc:a=>{st.docOpen=a;go('DOC')},
  upload:a=>{const f=document.getElementById('file');f.onchange=()=>{const file=f.files[0];if(!file)return;
      if(a==='doc'){st.uploads.push({k:'u'+Date.now(),t:file.name.replace(/\.[^.]+$/,''),s:'Загружено только что'});refresh();toast('Документ загружен')}
      else if(a==='ticket'){st.ticket={...TICKETS[0],num:'7012 3456 7890'};st.ticketSet=true;refresh();toast('Билет распознан и сохранён в «Документы»')}
      else toast('Фото добавлено');f.value=''};f.click()},
  plan:a=>{st.plan=a;refresh()},
  applyPlan:()=>{st.tariff=st.plan;toast('Тариф изменён. Письмо с подтверждением на почте');back()},
  unsub:()=>{closeSheet(true);toast('Подписка отключится 28 ноября. Письмо отправлено');stack=['W41'];show('W41','back')},
  logout:()=>openSheet(null,{html:'<div class="h2" style="font-size:20px">Выйти из аккаунта?</div><div class="s" style="color:var(--ink)">План переезда и документы сохранятся — войдите снова по номеру телефона</div>',foot:B('Выйти','data-act="logoutYes"')+B('Отмена','data-act="closeSheet"','sec')}),
  logoutYes:()=>{closeSheet(true);stack=['W04'];show('W04','fade')},
  retry:()=>{if(!navigator.onLine)return toast('Всё ещё нет сети');back()},
  agentRetry:()=>{st.chat=st.chat||[];st.chat.push(['ai','В Ясенево 3 школы из топ-300 рядом, в Митино — 2. Зато в Митино ближе к детским садам и дешевле аренда.'],['acts']);stack.pop();if(stack[stack.length-1]!=='W47')stack.push('W47');show('W47','back')},
  send:()=>{const inp=curEl.querySelector('#chatin');const t=inp.value.trim();if(!t)return;inp.value='';st.chat=st.chat.filter(m=>m[0]!=='acts');st.chat.push(['me',t]);
    const box=curEl.querySelector('#msgs');box.insertAdjacentHTML('beforeend',chatItem(['me',t])+chatItem(['typing']));const b=curEl.querySelector('.body');b.scrollTop=b.scrollHeight;
    setTimeout(()=>{if(/ясенев/i.test(t)){st.chat.pop();st.failedMsg=t;return go('W46',{replace:true})}
      const r=reply(t);st.chat.push(['ai',r],['acts']);if(curEl.dataset.id==='W47')refresh()},1100)},
  plusAfter:()=>{},
};
function reply(t){
  if(/бюджет|стоим|деньг|цен/i.test(t)) return 'При бюджете до '+money(st.budget)+' ₽ подходят Хорошёво-Мнёвники (≈ 91 000 ₽ в месяц со всеми расходами) и Митино (≈ 84 000 ₽). Посчитать подробно?';
  if(/школ|сад/i.test(t)) return 'Рядом с Хорошёво-Мнёвниками 3 школы из топ-300 и 4 детских сада, в Митино — 2 школы и 3 сада.';
  if(/документ/i.test(t)) return 'Для переезда понадобятся паспорта, свидетельства о рождении детей, договор аренды и медкарта ребёнка. Я веду чек-лист во вкладке «Документы».';
  return 'Учту это в анкете. Могу показать подходящие районы на карте, сравнить их или посчитать бюджет.';
}
function addVariant(x){st.s2.add=1;
  const base=VARIANTS[0];
  const n=x||[...VARIANTS,...EXTRA].find(e=>!st.variants.some(v=>v.addr===e.addr));
  if(!n)return false;
  if(st.variants.some(v=>v.addr===n.addr&&v.t===n.t))return false;
  st.variants.push({...base,school:450,m:84,owner:'Николай',floor:'5/9 эт.',sn:'Школа №1234',sr:'Рейтинг 4.7',...n,full:n.price+6000});return true}
function returnTo(id){const i=stack.lastIndexOf(id);if(i>=0){stack=stack.slice(0,i+1);show(id,'back')}else{stack.pop();stack.push(id);show(id,'back')}}
let jt=0,jtT;

/* делегирование кликов */
stage.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go],[data-tg],[data-chk],[data-chkbox],[data-sw]');if(!t||!stage.contains(t))return;
  // сначала вложенные действия внутри чекбокса (Подробнее ›)
  if(t.dataset.act){
    const single=t.closest('[data-single]');
    if(single&&(t.classList.contains('chip')||t.parentElement===single||t.closest('.seg'))){single.querySelectorAll(':scope > .on, :scope > button').forEach(b=>b.classList.remove('on'));t.classList.add('on')}
    e.stopPropagation();const f=ACT[t.dataset.act];if(f)f(t.dataset.a,t);return;
  }
  if(t.dataset.go){e.stopPropagation();return go(t.dataset.go,{replace:t.hasAttribute('data-replace')})}
  if(t.hasAttribute('data-tg')){const single=t.closest('[data-single]');if(single){single.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===t))}else t.classList.toggle('on');
    const p=t.closest('[data-act-tg="nowhen"]');if(p){const w=curEl.querySelector('#mwhen');w.disabled=t.classList.contains('on');w.style.opacity=w.disabled?.45:1}return}
  if(t.hasAttribute('data-sw')){t.classList.toggle('on');return}
  if(t.hasAttribute('data-chkbox')||t.hasAttribute('data-chk')){const row=t.hasAttribute('data-chkbox')?t.closest('.chk'):t;row.classList.toggle('on');const cl=row.closest('[data-cl]');if(cl){const n=cl.querySelectorAll('.chk.on').length,tot=+cl.dataset.total;
    curEl.querySelectorAll('[data-cnt]').forEach(x=>x.textContent=x.dataset.cnt.replace('{n}',n));curEl.querySelectorAll('[data-clbar] i').forEach(x=>x.style.width=n/tot*100+'%');
    if(cl.dataset.key)st[cl.dataset.key]=n}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
window.addEventListener('offline',()=>{st.offFrom=curEl&&curEl.dataset.id;go('W45')});
window.addEventListener('online',()=>toast('Сеть снова есть'));

/* =========================================================
   Скрытое меню экранов: тройной тап по «9:41»
   ========================================================= */
const MAPNAMES=['Карта 0 · Общая','Карта 1 · Подготовка','Карта 2 · Подбор жилья','Карта 3 · Переезд и адаптация'];
function presetFor(id){
  if(['W86','W72','W11','W12','W13','W14','W15'].includes(id))return 'p1';
  if(SCR[id]&&SCR[id].map===2||id==='W63')return 'p2';
  if(id==='W64')return 'p3';
  if(id==='W65'||['W36','W37','W38','W39','W40','W49','W50','W68','W69','W70','W71','W79','W81'].includes(id))return 'done';
  if(SCR[id]&&SCR[id].map===3||id==='W82')return 'p3b';
  return null;
}
function jumpTo(id){
  const p=presetFor(id);if(p){st=fresh();PRESETS[p]();if(['W18','W48','W26','W27','W28','W29','W23','W24','W59','W60','W83','W84','W85','W25','W61'].includes(id))ensureVariants();if(['W82'].includes(id)){}}
  closeSheet(true);
  if(SHEETS[id]){const base=currentHome();stack=[base];show(base,'fade');return setTimeout(()=>openSheet(id),50)}
  const h=currentHome();stack=HOME_IDS.includes(id)?[h]:[h,id];show(HOME_IDS.includes(id)?h:id,'fade');
}
function openJumper(){
  const all=[...Object.values(SCR).filter(s=>s.id!=='DOC'),...Object.entries(SHEETS).map(([id,s])=>({id,...s}))].sort((a,b)=>a.id.localeCompare(b.id));
  const html=`<div class="h2" style="font-size:20px">Все экраны</div><div class="xs">Быстрый переход для демонстрации. Состояние прогресса подстроится под карту экрана</div><div class="jl">`+
    [0,1,2,3].map(m=>`<div class="jh">${MAPNAMES[m]}</div>`+all.filter(s=>s.map===m).map(s=>`<button data-act="jump" data-a="${s.id}"><b>${s.id}</b>${s.name}</button>`).join('')).join('')+'</div>';
  openSheet(null,{html,foot:B('Сбросить прототип','data-act="resetAll"','sec')});
}
ACT.jump=a=>jumpTo(a);
ACT.resetAll=()=>{st=fresh();closeSheet(true);stack=['W01'];show('W01','fade')};

/* =========================================================
   Масштаб и старт
   ========================================================= */
function fit(){const ph=document.getElementById('phone');if(innerWidth<=500){ph.style.transform='';return}const s=Math.min(1,(innerHeight-40)/868,(innerWidth-40)/414);ph.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
(function start(){
  const h=(location.hash||'').slice(1).toUpperCase();
  if(h&&(SCR[h]||SHEETS[h])&&h!=='W01'){jumpTo(h);return}
  stack=['W01'];show('W01');
})();
</script>
